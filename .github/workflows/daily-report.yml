# 自动日更主调度是 Vercel Cron（vercel.json：UTC 10:00 夏令 / 11:00 冬令 ≈ 美西 03:00）。
# 本 workflow 只留手动 Run。手测可加 ?force=1 以跳过冬令 02:00 槽位与已采短路。
# 仓库 Secrets 须配置 CRON_SECRET（与 Vercel Production 的 CRON_SECRET 相同）。
name: daily-report

on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call production daily-report cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "Missing GitHub Actions secret: CRON_SECRET"
            exit 1
          fi
          # 不用 curl -f：500 时也要留下 JSON（含 drizzle cause）
          set +e
          http_code=$(curl -sS -X GET \
            --max-time 360 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: github-actions-asin-lens-daily-report" \
            "https://asin-lens.tuneyas.com/api/cron/daily-report" \
            -o /tmp/daily-report.json \
            -w "%{http_code}")
          curl_exit=$?
          set -e
          echo "http_status=${http_code} curl_exit=${curl_exit}"
          head -c 4000 /tmp/daily-report.json || true
          echo
          if [ "${http_code}" != "200" ]; then
            echo "cron HTTP ${http_code}"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          raw = open("/tmp/daily-report.json", encoding="utf-8").read()
          data = json.loads(raw)
          ok = data.get("ok")
          print("ok=", ok, "reportDate=", data.get("reportDate"), "projectCount=", data.get("projectCount"))
          if data.get("error"):
              print("error=", data.get("error")[:1500])
          if ok is False:
              sys.exit(2)
          PY
